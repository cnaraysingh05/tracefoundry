name: Detection validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.7'
      - name: Install pinned Sigma dependencies
        id: deps
        run: |
          python -m pip install -r examples/sigma-cli/requirements.txt
          python -m pip check
      - name: Validate rule metadata and reproduce the reference SPL
        id: validation
        run: ./scripts/validate-sigma.sh
      - name: Run ATT&CK tag regression tests
        id: tests
        run: python -m unittest discover -s tests -p 'test_sigma_validation.py' -v
      - name: Export generated SPL
        id: export
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          mkdir -p artifacts
          sigma convert -t splunk -p splunk_windows examples/sigma-cli/powershell-version.yml > "$RUNNER_TEMP/generated.spl"
          test -s "$RUNNER_TEMP/generated.spl"
          mv "$RUNNER_TEMP/generated.spl" artifacts/generated.spl
      - name: Summarize checks
        if: ${{ !cancelled() }}
        run: |
          mkdir -p artifacts
          printf '%s\n' '# Detection validation' '' \
            'Dependencies: ${{ steps.deps.outcome }}' \
            'Metadata and SPL comparison: ${{ steps.validation.outcome }}' \
            'Tag tests: ${{ steps.tests.outcome }}' \
            'SPL export: ${{ steps.export.outcome }}' \
            'Run: ${{ github.run_id }}, attempt ${{ github.run_attempt }}' \
            > artifacts/check-summary.md
          cat artifacts/check-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload validation evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: detection-validation
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
