name: Detection validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.7'
      - name: Install pinned Sigma dependencies
        run: |
          python -m pip install -r examples/sigma-cli/requirements.txt
          python -m pip check
      - name: Validate rule metadata and reproduce the reference SPL
        run: ./scripts/validate-sigma.sh
      - name: Run ATT&CK tag regression tests
        run: python -m unittest discover -s tests -p 'test_sigma_validation.py' -v
